<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings | BRB Studios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:ital,wght@0,400;0,500;0,700;1,400&display=swap">

  <link rel="stylesheet" href="../css/customer-base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/account-layout.css">
  <link rel="stylesheet" href="../css/calendar.css">
  <link rel="stylesheet" href="../css/my-bookings.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="home.html">
        <img class="site-header__logo" src="../CustomerImages/brb-logo.png" alt="BRB Studios">
      </a>

      <nav class="site-header__nav" aria-label="Main">
        <a class="site-header__link" href="home.html">Home</a>
        <a class="site-header__link" href="home.html#about">About</a>
        <a class="site-header__link" href="home.html#contact">Contact</a>
        <a class="site-header__link site-header__link--accent" href="book-service.html">My Profile</a>
      </nav>
    </div>
  </header>

  <div class="account">
    <aside class="account__sidebar">
      <p class="account__eyebrow">Account</p>
      <p class="account__name" id="accountName"></p>

      <nav class="account__menu" aria-label="Account">
        <a class="account__link" href="book-service.html">Book a service</a>
        <a class="account__link account__link--current" href="my-bookings.html" aria-current="page">My bookings</a>
        <a class="account__link" href="settings.html">Settings</a>
      </nav>

      <button class="account__logout" id="logoutButton" type="button">
        <span class="account__logout-icon" aria-hidden="true"></span>
        Logout
      </button>
    </aside>

    <main class="account__main">
      <h1 class="bookings-page__title">My Bookings</h1>

      <!-- Status filter tabs -->
      <div class="status-tabs" role="tablist" aria-label="Filter by status">
        <button class="status-tab status-tab--active" role="tab" aria-selected="true"  data-status="">All Statuses</button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="To Pay">To Pay</button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="Pending">Pending</button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="Confirmed">Confirmed</button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="Completed">Completed</button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="Rejected">Reject</button>
      </div>

      <p class="bookings-page__status" id="listStatus" role="status">Loading your bookings...</p>

      <ul class="booking-cards" id="bookingList"></ul>
    </main>
  </div>

  <!-- Booking detail modal -->
  <div class="modal-overlay" id="detailOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="modal__close" id="detailClose" type="button" aria-label="Close"></button>

      <div class="modal__body" id="detailBody">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <!-- Templates -->
  <template id="bookingCardTemplate">
    <li class="booking-card">
      <div class="booking-card__header">
        <span class="booking-card__ref"></span>
        <span class="booking-card__badge"></span>
      </div>
      <div class="booking-card__body">
        <div class="booking-card__media">
          <img class="booking-card__image" alt="">
        </div>
        <div class="booking-card__info">
          <p class="booking-card__services"></p>
          <p class="booking-card__description"></p>
          <p class="booking-card__price"></p>
          <p class="booking-card__date"></p>
          <p class="booking-card__time"></p>
        </div>
      </div>
      <div class="booking-card__actions"></div>
    </li>
  </template>

  <script type="module" src="../js/my-bookings.js"></script>
</body>
</html>
